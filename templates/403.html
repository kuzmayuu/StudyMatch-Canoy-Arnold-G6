{% extends "base.html" %}
{% block title %}Access denied &middot; StudyMatch{% endblock %}
{% block content %}
<section class="card narrow center">
  <h1>Access denied</h1>
  <p class="muted">You don't have permission to open this page.</p>
  {% if user.is_authenticated %}
    <a class="btn btn-primary" href="{% url 'accounts:dashboard' %}">Go to my dashboard</a>
  {% else %}
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">Log in</a>
  {% endif %}
</section>
{% endblock %}
