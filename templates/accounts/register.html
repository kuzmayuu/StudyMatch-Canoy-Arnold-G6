{% extends "base.html" %}
{% block title %}Register &middot; StudyMatch{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create your account</h1>
  <p class="muted">Register with your CIT-U email to find study partners.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>
  <p class="muted center">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</section>
{% endblock %}
