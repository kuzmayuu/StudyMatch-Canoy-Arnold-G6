{% extends "base.html" %}
{% block title %}Edit Profile &middot; StudyMatch{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Edit profile</h1>
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" with form=user_form %}
    {% include "accounts/_form_fields.html" with form=profile_form %}
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a class="btn" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</section>
{% endblock %}
