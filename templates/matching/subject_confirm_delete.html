{% extends "base.html" %}
{% block title %}Delete subject &middot; StudyMatch{% endblock %}
{% block content %}
<section class="card narrow center">
  <h1>Delete subject?</h1>
  <p>{{ subject }} will be removed from the catalog and from every student's list.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Yes, delete</button>
    <a class="btn" href="{% url 'matching:subject_list' %}">Cancel</a>
  </form>
</section>
{% endblock %}
