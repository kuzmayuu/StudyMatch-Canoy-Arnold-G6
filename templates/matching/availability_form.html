{% extends "base.html" %}
{% block title %}Edit slot &middot; StudyMatch{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Edit time slot</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a class="btn" href="{% url 'matching:availability_list' %}">Cancel</a>
  </form>
</section>
{% endblock %}
