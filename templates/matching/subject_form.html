{% extends "base.html" %}
{% block title %}{{ title }} &middot; StudyMatch{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ title }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn" href="{% url 'matching:subject_list' %}">Cancel</a>
  </form>
</section>
{% endblock %}
