{% extends "base.html" %}
{% block title %}Study Preferences &middot; StudyMatch{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Study preferences</h1>
  <p class="muted">These help rank your match suggestions.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn btn-primary">Save preferences</button>
  </form>
</section>
{% endblock %}
